name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required permission for test reporters to create workflow summaries
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  backend:
    name: .NET Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      # Prevents Kestrel from crashing on HTTPS bindings
      - name: Generate .NET dev cert
        run: |
          dotnet dev-certs https
          sudo mkdir -p /usr/local/share/ca-certificates/aspnet
          sudo -E dotnet dev-certs https -ep /usr/local/share/ca-certificates/aspnet/https.crt --format PEM
          sudo update-ca-certificates

      - run: dotnet build PlaylistApp.slnx -c Release

      - name: Run .NET Integration Tests
        working-directory: ./PlaylistApp.Tests.Integration
        # Appended the trx logger. Outputs to ./TestResults/test-results.trx by default
        run: dotnet test -c Release --no-build --no-restore --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx"
      
      - name: Publish .NET Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: .NET Backend Test Summary
          path: ./PlaylistApp.Tests.Integration/TestResults/test-results.trx
          reporter: dotnet-trx
  
  frontend:
    name: React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'PlaylistApp.Web/package-lock.json'
      - working-directory: ./PlaylistApp.Web
        run: npm ci
      - working-directory: ./PlaylistApp.Web
        run: npm test -- --run
      - working-directory: ./PlaylistApp.Web
        run: npm run build