name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 1' # Runs every Monday at 2:00 AM

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Enables rigorous checks for both security vulnerabilities and code quality
        queries: security-extended,security-and-quality

    # Explicitly build the C# backend to ensure CodeQL traces the .NET 10 build successfully
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Build C# Code
      if: matrix.language == 'csharp'
      run: dotnet build PlaylistApp.slnx -c Release

    # Let the CodeQL autobuilder handle the React/TypeScript frontend
    - name: Autobuild Frontend
      if: matrix.language != 'csharp'
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
